{% extends 'base.html' %}

{% block title %}Set New Password — GlobeTrotter{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem;">
    <div class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
        <div style="text-align: center; padding: 2.5rem 2rem 1.5rem; background: linear-gradient(180deg, #eef2ff 0%, #ffffff 100%);">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 2rem;">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 style="font-size: 1.6rem; margin-bottom: 0.25rem;">Create New Password</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Choose a strong new password for your account</p>
        </div>

        <div style="padding: 1.5rem 2rem 2.5rem;">
            <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6" autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required minlength="6">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1rem;">
                    Update Password & Log In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
