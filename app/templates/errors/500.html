{% extends 'base.html' %}

{% block title %}Server Error — GlobeTrotter{% endblock %}

{% block content %}
<div class="container" style="padding: 5rem 1.5rem; text-align: center;">
    <div style="width: 100px; height: 100px; border-radius: 50%; background: #fee2e2; color: var(--accent-rose); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 3rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">500</h1>
    <h2 style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-secondary);">Turbulence Ahead / Server Error</h2>
    <p style="color: var(--text-muted); max-width: 480px; margin: 0 auto 2rem;">
        An unexpected error occurred while calculating your itinerary details. Please try again in a few moments.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fa-solid fa-house"></i> Return to Homepage
    </a>
</div>
{% endblock %}
