{% extends 'base.html' %}

{% block title %}Edit {{ trip.title }} — GlobeTrotter{% endblock %}

{% block content %}
<div class="container" style="padding: 2.5rem 1.5rem 4rem; max-width: 800px;">
    <div style="margin-bottom: 2rem;">
        <a href="{{ url_for('itinerary.view_itinerary', trip_id=trip.id) }}" style="font-size: 0.9rem; margin-bottom: 0.5rem; display: inline-flex; align-items: center; gap: 0.4rem;">
            <i class="fa-solid fa-arrow-left"></i> Back to Itinerary
        </a>
        <h1 style="font-size: 2rem; margin-top: 0.5rem;">Edit Trip Settings</h1>
        <p style="color: var(--text-secondary);">Update dates, budget limit, description, or visibility for {{ trip.title }}</p>
    </div>

    <div class="card" style="padding: 2rem; box-shadow: var(--shadow-md);">
        <form action="{{ url_for('trips.edit_trip', trip_id=trip.id) }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label class="form-label" for="title">Trip Name *</label>
                <input type="text" id="title" name="title" class="form-control" value="{{ trip.title }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="start_date">Start Date *</label>
                    <input type="date" id="start_date" name="start_date" class="form-control" value="{{ trip.start_date.isoformat() }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="end_date">End Date *</label>
                    <input type="date" id="end_date" name="end_date" class="form-control" value="{{ trip.end_date.isoformat() }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="target_budget">Target Budget ($)</label>
                    <input type="number" step="10" min="0" id="target_budget" name="target_budget" class="form-control" value="{{ trip.target_budget }}">
                </div>
                <div class="form-group">
                    <label class="form-label" for="visibility">Visibility</label>
                    <select id="visibility" name="visibility" class="form-control">
                        <option value="private" {% if trip.visibility == 'private' %}selected{% endif %}>Private</option>
                        <option value="public" {% if trip.visibility == 'public' %}selected{% endif %}>Public (Community Hub)</option>
                        <option value="shared" {% if trip.visibility == 'shared' %}selected{% endif %}>Shared (Direct link only)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="description">Trip Description</label>
                <textarea id="description" name="description" class="form-control">{{ trip.description }}</textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Current Cover Image</label>
                <div style="margin-bottom: 1rem;">
                    <img src="{{ trip.cover_image }}" alt="Cover" style="width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md);">
                </div>
                <input type="file" name="cover_image_file" class="form-control" accept="image/*">
                <span class="form-help">Upload a new cover image to replace current</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-light); padding-top: 1.5rem; margin-top: 2rem;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('itinerary.view_itinerary', trip_id=trip.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
